<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <radialGradient id="marqueeGlow" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emeraldCorner" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="560" fill="url(#marqueeGlow)"/>
  <rect width="1400" height="560" fill="url(#emeraldCorner)"/>

  <!-- Subtle Ambient Diagonal Lines -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1.5">
    <line x1="-100" y1="0" x2="600" y2="700"/>
    <line x1="100" y1="0" x2="800" y2="700"/>
    <line x1="300" y1="0" x2="1000" y2="700"/>
    <line x1="500" y1="0" x2="1200" y2="700"/>
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(100, 100)">
    <!-- Brand Tag -->
    <g transform="translate(0, 0)">
      <rect width="128" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#818CF8"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C7D2FE" letter-spacing="1">CHROME EXTENSION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Zentime</text>
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#E2E8F0" letter-spacing="-0.5">Stay in flow. Reclaim your screen time.</text>

    <!-- Paragraph Description -->
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" line-height="26">
      <tspan x="0" dy="0">Intentional per-website focus timers, gentle interstitial breathing pauses,</tspan>
      <tspan x="0" dy="26">structured Pomodoro cycles, and private 7-day usage insights.</tspan>
    </text>

    <!-- Value Badges -->
    <g transform="translate(0, 248)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="168" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🔒 100% Private</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="180" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="200" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">⚡ Zero Battery Drain</text>

      <!-- Badge 3 -->
      <rect x="372" y="0" width="164" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="392" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🧘 Mindful Friction</text>
    </g>

    <!-- Bottom Secondary Badges -->
    <g transform="translate(0, 316)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#64748B">
        No accounts required • No telemetry • Web Audio gentle chimes • English &amp; Bahasa Indonesia
      </text>
    </g>
  </g>

  <!-- RIGHT MOCKUP CARD (Floating UI) -->
  <g transform="translate(900, 50)" filter="url(#bigShadow)">
    <!-- Popup Frame Container -->
    <rect width="400" height="460" rx="28" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Header -->
    <g transform="translate(24, 24)">
      <!-- Logo circle -->
      <circle cx="20" cy="20" r="20" fill="url(#primaryGrad)"/>
      <path d="M14 11 h12 a1.5 1.5 0 0 1 1.5 1.5 v1.5 c0 3-2 5-4.5 6.5 2.5 1.5 4.5 3.5 4.5 6.5 v1.5 a1.5 1.5 0 0 1-1.5 1.5 H14 a1.5 1.5 0 0 1-1.5-1.5 v-1.5 c0-3 2-5 4.5-6.5 -2.5-1.5-4.5-3.5-4.5-6.5 v-1.5 a1.5 1.5 0 0 1 1.5-1.5 z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      
      <!-- Brand & Active Domain -->
      <text x="50" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Zentime</text>
      <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#10B981">● Active: github.com</text>

      <!-- Language & Theme badges -->
      <rect x="290" y="8" width="28" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
      <text x="304" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">EN</text>
      <circle cx="334" cy="20" r="12" fill="rgba(255,255,255,0.08)"/>
      <path d="M331 15 a6 6 0 1 0 6 9 7 7 0 0 1-6-9 z" fill="#FCD34D"/>
    </g>

    <!-- Segmented Tab Navigation -->
    <g transform="translate(24, 76)">
      <rect width="352" height="34" rx="10" fill="rgba(0,0,0,0.3)"/>
      <rect x="3" y="3" width="82" height="28" rx="8" fill="#4F46E5"/>
      <text x="44" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Timer</text>
      <text x="132" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Pomodoro</text>
      <text x="218" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Limits</text>
      <text x="306" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Insights</text>
    </g>

    <!-- Circular Progress Timer Graphic -->
    <g transform="translate(200, 215)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
      <!-- Active Arc (Emerald/Indigo) -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="url(#primaryGrad)" stroke-width="10" 
              stroke-dasharray="477" stroke-dashoffset="130" stroke-linecap="round" transform="rotate(-90)"/>
      
      <!-- Time Text -->
      <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace, -apple-system" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-1">24:18</text>
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#818CF8" letter-spacing="0.5">FOCUS SESSION</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 320)">
      <!-- Main Play/Pause Button -->
      <rect width="270" height="44" rx="14" fill="#4F46E5"/>
      <path d="M125 15 L145 22 L125 29 Z" fill="#FFFFFF"/>
      <text x="156" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Running</text>

      <!-- Reset Button -->
      <rect x="282" width="70" height="44" rx="14" fill="rgba(255,255,255,0.08)"/>
      <text x="317" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Reset</text>
    </g>

    <!-- Bottom Mini-Insight Bar -->
    <g transform="translate(24, 384)">
      <rect width="352" height="52" rx="12" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Today's Total Screen Time</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#94A3B8">Across all visited websites</text>
      <text x="336" y="33" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#10B981">2h 45m</text>
    </g>
  </g>
</svg>
