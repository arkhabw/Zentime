<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="screenBg1" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070A11" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#screenBg1)"/>

  <!-- Headline & Subtitle -->
  <g transform="translate(640, 72)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818CF8" letter-spacing="2">FEATURE 01 / POMODORO &amp; FOCUS</text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">Stay in the Zone with Intentional Timers</text>
    <text y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Track open-ended browsing sessions or structured 25m Pomodoro cycles with auto-pausing on tab switch.</text>
  </g>

  <!-- TWO SIDE-BY-SIDE MOCKUPS -->
  
  <!-- LEFT MOCKUP: Pomodoro Tab -->
  <g transform="translate(220, 200)" filter="url(#shadow1)">
    <rect width="380" height="520" rx="24" fill="url(#cardGrad1)" stroke="url(#cardBorder1)" stroke-width="1.5"/>

    <!-- Header -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#4F46E5"/>
      <path d="M11 9 h10 v2 c0 2.5-1.5 4-3.5 5 2 1 3.5 2.5 3.5 5 v2 H11 v-2 c0-2.5 1.5-4 3.5-5 -2-1-3.5-2.5-3.5-5 z" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="42" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Zentime</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#10B981">● figma.com</text>
      <rect x="290" y="4" width="50" height="22" rx="11" fill="rgba(99,102,241,0.2)"/>
      <text x="315" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#818CF8">POMO</text>
    </g>

    <!-- Navigation -->
    <g transform="translate(20, 68)">
      <rect width="340" height="32" rx="8" fill="rgba(0,0,0,0.35)"/>
      <rect x="88" y="2" width="82" height="28" rx="6" fill="#4F46E5"/>
      <text x="44" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Timer</text>
      <text x="129" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Pomodoro</text>
      <text x="214" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Batas</text>
      <text x="298" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Wawasan</text>
    </g>

    <!-- Pomodoro Ring -->
    <g transform="translate(190, 215)">
      <circle cx="0" cy="0" r="76" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
      <circle cx="0" cy="0" r="76" fill="none" stroke="#4F46E5" stroke-width="10" stroke-dasharray="477" stroke-dashoffset="140" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#FFFFFF">18:42</text>
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#10B981">FOKUS (SIKLUS 2/4)</text>
    </g>

    <!-- Action & Cycle indicator -->
    <g transform="translate(20, 320)">
      <rect width="250" height="42" rx="12" fill="#4F46E5"/>
      <text x="125" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">⏸ Jeda Fokus</text>

      <rect x="260" width="80" height="42" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="300" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Lewati</text>
    </g>

    <g transform="translate(20, 385)">
      <rect width="340" height="96" rx="12" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Target Selesai: 12:15</text>
      <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94A3B8">Istirahat berikutnya: 5 menit (Genta Tibet Aktif)</text>
      <!-- Progress Bar -->
      <rect x="16" y="62" width="308" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
      <rect x="16" y="62" width="180" height="6" rx="3" fill="#10B981"/>
      <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#64748B">Siklus 2 dari 4 diselesaikan</text>
    </g>
  </g>

  <!-- RIGHT MOCKUP: Manual Timer Tab -->
  <g transform="translate(680, 200)" filter="url(#shadow1)">
    <rect width="380" height="520" rx="24" fill="url(#cardGrad1)" stroke="url(#cardBorder1)" stroke-width="1.5"/>

    <!-- Header -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#10B981"/>
      <text x="42" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Zentime</text>
      <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#10B981">● docs.google.com</text>
      <rect x="290" y="4" width="50" height="22" rx="11" fill="rgba(16,185,129,0.2)"/>
      <text x="315" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#6EE7B7">FLOW</text>
    </g>

    <!-- Navigation -->
    <g transform="translate(20, 68)">
      <rect width="340" height="32" rx="8" fill="rgba(0,0,0,0.35)"/>
      <rect x="4" y="2" width="82" height="28" rx="6" fill="#4F46E5"/>
      <text x="45" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Timer</text>
      <text x="129" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Pomodoro</text>
      <text x="214" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Batas</text>
      <text x="298" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Wawasan</text>
    </g>

    <!-- Countup Display -->
    <g transform="translate(190, 215)">
      <circle cx="0" cy="0" r="76" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
      <circle cx="0" cy="0" r="76" fill="none" stroke="#10B981" stroke-width="10" stroke-dasharray="477" stroke-dashoffset="260" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#FFFFFF">42:15</text>
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#10B981">COUNT-UP AKTIF</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(20, 320)">
      <rect width="250" height="42" rx="12" fill="#10B981"/>
      <text x="125" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#064E3B">▶ Sedang Berjalan</text>

      <rect x="260" width="80" height="42" rx="12" fill="rgba(255,255,255,0.08)"/>
      <text x="300" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Reset</text>
    </g>

    <!-- Quick Presets -->
    <g transform="translate(20, 385)">
      <rect width="340" height="96" rx="12" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Preset Cepat:</text>
      <!-- Preset pills -->
      <g transform="translate(16, 42)">
        <rect x="0" y="0" width="68" height="32" rx="8" fill="rgba(255,255,255,0.08)"/>
        <text x="34" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">15m</text>

        <rect x="78" y="0" width="68" height="32" rx="8" fill="#4F46E5"/>
        <text x="112" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">25m</text>

        <rect x="156" y="0" width="68" height="32" rx="8" fill="rgba(255,255,255,0.08)"/>
        <text x="190" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">45m</text>

        <rect x="234" y="0" width="74" height="32" rx="8" fill="rgba(255,255,255,0.08)"/>
        <text x="271" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">Count-Up</text>
      </g>
    </g>
  </g>
</svg>
