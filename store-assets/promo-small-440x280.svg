<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="80%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bgGlow)"/>
  <rect width="440" height="280" fill="url(#emeraldGlow)"/>

  <!-- Subtle Ambient Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="70" x2="440" y2="70"/>
    <line x1="0" y1="140" x2="440" y2="140"/>
    <line x1="0" y1="210" x2="440" y2="210"/>
    <line x1="110" y1="0" x2="110" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="330" y1="0" x2="330" y2="280"/>
  </g>

  <!-- Central Card -->
  <rect x="36" y="24" width="368" height="232" rx="20" fill="rgba(15, 23, 42, 0.65)" stroke="url(#borderGrad)" stroke-width="1" filter="url(#shadow)"/>

  <!-- Logo Mark Container -->
  <g transform="translate(192, 46)">
    <circle cx="28" cy="28" r="28" fill="url(#logoGrad)" filter="url(#shadow)"/>
    <!-- Serene Hourglass Icon -->
    <path d="M20 16 h16 a2 2 0 0 1 2 2 v2 c0 4-3 7-6 9 3 2 6 5 6 9 v2 a2 2 0 0 1-2 2 H20 a2 2 0 0 1-2-2 v-2 c0-4 3-7 6-9 -3-2-6-5-6-9 v-2 a2 2 0 0 1 2-2 z" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="1.5" fill="#FFFFFF"/>
    <path d="M24 35 h8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="220" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Zentime</text>
  <text x="220" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#94A3B8" letter-spacing="0.2">Mindful Web Timer &amp; Screen Time</text>

  <!-- Feature Pills -->
  <g transform="translate(68, 172)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="88" height="24" rx="12" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <text x="44" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#A5B4FC">⏱️ Focus Timer</text>

    <!-- Pill 2 -->
    <rect x="96" y="0" width="98" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="145" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#6EE7B7">🛑 Mindful Pause</text>

    <!-- Pill 3 -->
    <rect x="202" y="0" width="102" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <text x="253" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#FCD34D">📊 7-Day Insights</text>
  </g>

  <!-- Bottom Trust Seal -->
  <g transform="translate(220, 230)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
      🔒 100% Private &amp; Offline <tspan fill="#475569">•</tspan> Zero Tracking <tspan fill="#475569">•</tspan> Manifest V3
    </text>
  </g>
</svg>
