<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <radialGradient id="blockerGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="circleBreathing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#blockerGlow)"/>

  <!-- Headline Header -->
  <g transform="translate(640, 68)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#6EE7B7" letter-spacing="2">FEATURE 02 / MINDFUL INTERSTITIAL BLOCKER</text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">Gentle Mindful Friction When Limits Are Reached</text>
    <text y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Transform compulsive doomscrolling into a conscious choice with breathing reflections and emergency snooze.</text>
  </g>

  <!-- Centered Mindful Interstitial Mockup Card (blocked.html UI) -->
  <g transform="translate(380, 185)" filter="url(#cardShadow2)">
    <rect width="520" height="560" rx="32" fill="url(#cardGrad2)" stroke="url(#borderGrad2)" stroke-width="1.5"/>

    <!-- Breathing Ripple Effect Ring -->
    <g transform="translate(260, 110)">
      <circle cx="0" cy="0" r="62" fill="url(#circleBreathing)"/>
      <circle cx="0" cy="0" r="48" fill="rgba(99, 102, 241, 0.2)" stroke="#818CF8" stroke-width="2"/>
      <circle cx="0" cy="0" r="34" fill="#4F46E5"/>
      <!-- Sandglass/Lotus Zen Icon -->
      <path d="M-10 -12 H10 v3 c0 5 -4 9 -8 11 4 2 8 6 8 11 v3 H-10 v-3 c0-5 4-9 8-11 -4-2-8-6-8-11 z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Status Badge -->
    <g transform="translate(260, 205)">
      <rect x="-85" y="0" width="170" height="28" rx="14" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
      <circle cx="-65" cy="14" r="4" fill="#F43F5E"/>
      <text x="-50" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FDA4AF">BATAS HARIAN TERCAPAI</text>
    </g>

    <!-- Main Message -->
    <text x="260" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Waktunya Istirahat Sejenak</text>
    <text x="260" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#94A3B8">
      Kamu sudah menghabiskan kuota hari ini di <tspan font-weight="700" fill="#FFFFFF">youtube.com</tspan>.
    </text>

    <!-- Stats Pill Container -->
    <g transform="translate(50, 325)">
      <rect width="420" height="68" rx="16" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      
      <!-- Stat 1: Waktu Dipakai -->
      <text x="75" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">WAKTU TERPAKAI</text>
      <text x="75" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="700" fill="#F43F5E">35m 12s</text>

      <!-- Divider line -->
      <line x1="180" y1="16" x2="180" y2="52" stroke="rgba(255,255,255,0.1)"/>

      <!-- Stat 2: Batas Harian -->
      <text x="285" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">BATAS HARIAN</text>
      <text x="285" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="700" fill="#E2E8F0">30m 00s</text>
    </g>

    <!-- Mindful Tip Box -->
    <g transform="translate(50, 410)">
      <rect width="420" height="42" rx="12" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1"/>
      <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#C7D2FE">
        🌿 Tarik napas perlahan... Apakah kamu sungguh perlu membuka tab ini sekarang?
      </text>
    </g>

    <!-- Interactive Buttons -->
    <g transform="translate(50, 474)">
      <!-- Close Tab (High contrast primary) -->
      <rect width="255" height="48" rx="14" fill="#4F46E5"/>
      <text x="127" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">✕ Tutup Tab Ini</text>

      <!-- Snooze (+5 Menit emergency) -->
      <rect x="270" width="150" height="48" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="345" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">+5 Menit Darurat</text>
    </g>
  </g>
</svg>
