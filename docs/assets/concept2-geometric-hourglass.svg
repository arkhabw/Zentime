  <path d="M 186 140 C 186 210, 230 240, 256 256 C 282 272, 326 302, 326 372" fill="none" stroke="url(#glass)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 326 140 C 326 210, 282 240, 256 256 C 230 272, 186 302, 186 372" fill="none" stroke="url(#glass)" stroke-width="22" stroke-linecap="round"/>
  <line x1="166" y1="372" x2="346" y2="372" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  
  <circle cx="256" cy="256" r="12" fill="#0A84FF"/>
